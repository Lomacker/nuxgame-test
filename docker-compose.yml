services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: nuxgame_test_app
        working_dir: /var/www
        volumes:
            - .:/var/www
        ports:
            - "8000:8000"
        depends_on:
            - mysql
        command: php artisan serve --host=0.0.0.0 --port=8000

    mysql:
        image: mysql:8
        container_name: nuxgame_test_mysql
        environment:
            MYSQL_DATABASE: nuxgame_test
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
